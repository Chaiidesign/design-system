<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results</title>
<script>var p=new URLSearchParams(location.search),t=p.get("theme"),a=p.get("accent");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(a==="blue"||a==="teal")document.documentElement.dataset.accent=a</script>
<link rel="stylesheet" href="../dist/souvenir.css">
<script type="module" src="../dist/souvenir.js"></script>
</head>
<body>
<main class="sv-page sv-stack" data-gap="6">
  <h1>Search results</h1>
  <form class="sv-stack" role="search" action="/search#result" method="get">
    <sv-field>
      <div class="sv-field">
        <label class="sv-field__label" for="q">Words to search for</label>
        <p class="sv-field__error" id="q-error" hidden></p>
        <input class="sv-field__control" id="q" name="q" type="search" value="blue linen shirt with long sleeves" required
          enterkeyhint="search" autocapitalize="off"
          aria-describedby="q-error"
          data-error-required="Enter the words to search for.">
      </div>
    </sv-field>
    <button type="submit" class="sv-button" data-variant="primary">Search the shop</button>
  </form>
  <div class="sv-message" data-tone="info" role="status" id="result" tabindex="-1">
    <span class="sv-message__mark" aria-hidden="true"></span>
    <p>Nothing found for “<span data-user-content>blue linen shirt with long sleeves</span>”. Check the spelling or use fewer words.</p>
    <a class="sv-button" data-variant="quiet" href="/shop">See all products</a>
  </div>
</main>
</body>
</html>
