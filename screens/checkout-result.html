<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order placed</title>
<script>var p=new URLSearchParams(location.search),t=p.get("theme"),a=p.get("accent");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(a==="blue"||a==="teal")document.documentElement.dataset.accent=a</script>
<link rel="stylesheet" href="../dist/souvenir.css">
<script type="module" src="../dist/souvenir.js"></script>
</head>
<body>
<main class="sv-page sv-stack" data-gap="6">
  <h1>Order placed</h1>

  <div class="sv-message" data-tone="success" role="status">
    <span class="sv-message__mark" aria-hidden="true"></span>
    <p>Order placed. Receipt sent to sam@example.com.</p>
  </div>

  <div class="sv-message" data-tone="info" role="note">
    <span class="sv-message__mark" aria-hidden="true"></span>
    <p>This is a test page. Nothing will be charged.</p>
  </div>

  <section class="sv-panel sv-stack" aria-labelledby="summary-heading">
    <h2 id="summary-heading">Order summary</h2>
    <dl class="sv-cost-summary">
      <div class="sv-cost-summary__row"><dt>Items</dt><dd>£61.80</dd></div>
      <div class="sv-cost-summary__row"><dt>Discount: Welcome discount</dt><dd>−£5.00</dd></div>
      <div class="sv-cost-summary__row"><dt>Delivery</dt><dd>£3.95</dd></div>
      <div class="sv-cost-summary__row" data-row="total"><dt>Total</dt><dd>£60.75<p class="sv-cost-summary__note">Includes £10.13 VAT</p></dd></div>
    </dl>
  </section>

  <p><a class="sv-button" data-variant="quiet" href="checkout.html">Back to checkout</a></p>
</main>
</body>
</html>
