<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error summary: demo</title>
<script>var p=new URLSearchParams(location.search),t=p.get("theme"),a=p.get("accent");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(a==="blue"||a==="teal")document.documentElement.dataset.accent=a</script>
<link rel="stylesheet" href="../dist/souvenir.css">
<script type="module" src="../dist/souvenir.js"></script>
</head>
<body>
<main class="sv-page sv-stack" data-gap="6">
  <h1>Contact details</h1>

  <sv-error-summary for="contact">
    <div class="sv-error-summary" role="alert" tabindex="-1" aria-labelledby="problem-title">
      <h2 class="sv-error-summary__title" id="problem-title">There is a problem</h2>
      <ul class="sv-error-summary__list">
        <li><a href="#contact-name">Enter your full name.</a></li>
        <li><a href="#contact-email">Enter an email address with an @, like name@example.com.</a></li>
      </ul>
    </div>
  </sv-error-summary>

  <form class="sv-panel sv-stack" id="contact" action="demo-error-summary.html" method="get">
    <sv-field>
      <div class="sv-field">
        <label class="sv-field__label" for="contact-name">Full name</label>
        <p class="sv-field__error" id="contact-name-error">Enter your full name.</p>
        <input class="sv-field__control" id="contact-name" name="name" type="text" autocomplete="name" required aria-invalid="true" aria-describedby="contact-name-error" data-error-required="Enter your full name.">
      </div>
    </sv-field>
    <sv-field>
      <div class="sv-field">
        <label class="sv-field__label" for="contact-email">Email address</label>
        <p class="sv-field__hint" id="contact-email-hint">We'll send your receipt here</p>
        <p class="sv-field__error" id="contact-email-error">Enter an email address with an @, like name@example.com.</p>
        <input class="sv-field__control" id="contact-email" name="email" type="email" autocomplete="email" value="sam.example.com" required aria-invalid="true" aria-describedby="contact-email-hint contact-email-error" data-error-required="Enter your email address." data-error-type="Enter an email address with an @, like name@example.com.">
      </div>
    </sv-field>
    <sv-field>
      <div class="sv-field">
        <label class="sv-field__label" for="contact-phone">Phone number (optional)</label>
        <p class="sv-field__hint" id="contact-phone-hint">For questions about delivery only</p>
        <input class="sv-field__control" id="contact-phone" name="phone" type="tel" autocomplete="tel" aria-describedby="contact-phone-hint">
      </div>
    </sv-field>
    <button class="sv-button" data-variant="primary" data-width="full" type="submit">Continue to delivery</button>
  </form>
</main>
</body>
</html>
