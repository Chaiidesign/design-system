<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account settings</title>
<script>var p=new URLSearchParams(location.search),t=p.get("theme"),a=p.get("accent");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(a==="blue"||a==="teal")document.documentElement.dataset.accent=a</script>
<link rel="stylesheet" href="../../dist/souvenir.css">
<script type="module" src="../../dist/souvenir.js"></script>
</head>
<body>
<main class="sv-page sv-stack" data-gap="6">
  <h1>Account settings</h1>
  <sv-error-summary for="settings">
    <div class="sv-error-summary" role="alert" tabindex="-1" aria-labelledby="problem-title" hidden>
      <h2 class="sv-error-summary__title" id="problem-title">There is a problem</h2>
      <ul class="sv-error-summary__list"></ul>
    </div>
  </sv-error-summary>
  <form id="settings" class="sv-stack" data-gap="6" action="/settings" method="post">
    <section class="sv-stack" aria-labelledby="details-heading">
      <h2 id="details-heading">Your details</h2>
      <sv-field>
        <div class="sv-field">
          <label class="sv-field__label" for="name">Name</label>
          <p class="sv-field__error" id="name-error" hidden></p>
          <input class="sv-field__control" id="name" name="name" type="text" autocomplete="name" required value="Amara Okafor"
            aria-describedby="name-error"
            data-error-required="Enter your name.">
        </div>
      </sv-field>
      <sv-field>
        <div class="sv-field">
          <label class="sv-field__label" for="email">Email address</label>
          <p class="sv-field__hint" id="email-hint">We'll send order updates here</p>
          <p class="sv-field__error" id="email-error" hidden></p>
          <input class="sv-field__control" id="email" name="email" type="email" autocomplete="email" required value="amara.okafor@example.com"
            aria-describedby="email-hint email-error"
            data-error-required="Enter your email address."
            data-error-type="Enter an email address with an @, like name@example.com.">
        </div>
      </sv-field>
      <div class="sv-field">
        <label class="sv-field__label" for="language">Language</label>
        <select class="sv-field__control sv-select" id="language" name="language">
          <option value="en" selected>English</option>
          <option value="fr" lang="fr">Français</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </div>
    </section>
    <section class="sv-stack" aria-labelledby="notifications-heading">
      <h2 id="notifications-heading">Notifications</h2>
      <div class="sv-stack" data-gap="2" role="group" aria-labelledby="notifications-heading">
        <label class="sv-checkbox">
          <input type="checkbox" name="order-email" checked>
          <span class="sv-checkbox__label">Email me updates about my orders</span>
        </label>
        <label class="sv-checkbox">
          <input type="checkbox" name="order-text">
          <span class="sv-checkbox__label">Text me updates about my orders</span>
        </label>
        <label class="sv-checkbox">
          <input type="checkbox" name="news">
          <span class="sv-checkbox__label">Email me news and offers</span>
        </label>
      </div>
    </section>
    <button type="submit" class="sv-button" data-variant="primary" data-width="full">Save changes</button>
  </form>
  <section class="sv-stack" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete account</h2>
    <p>Deleting your account removes your details and your order history. It cannot be undone.</p>
    <a class="sv-button" data-variant="secondary" href="delete-account.html">Delete account</a>
  </section>
</main>
</body>
</html>
