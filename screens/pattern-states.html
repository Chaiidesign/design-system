<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page states</title>
<script>var p=new URLSearchParams(location.search),t=p.get("theme"),a=p.get("accent");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(a==="blue"||a==="teal")document.documentElement.dataset.accent=a</script>
<link rel="stylesheet" href="../dist/souvenir.css">
<script type="module" src="../dist/souvenir.js"></script>
</head>
<body>
<main class="sv-page sv-stack" data-gap="6">
  <h1>Page states</h1>

  <section class="sv-stack" aria-labelledby="saved">
    <h2 id="saved">After a save</h2>
    <div class="sv-message" data-tone="success" role="status">
      <span class="sv-message__mark" aria-hidden="true"></span>
      <p>Your changes are saved.</p>
    </div>
  </section>

  <section class="sv-stack" aria-labelledby="empty">
    <h2 id="empty">An empty list</h2>
    <div class="sv-message" data-tone="info">
      <span class="sv-message__mark" aria-hidden="true"></span>
      <p>You have no orders yet. When you place one, it will appear here.</p>
      <a class="sv-button" data-variant="quiet" href="/shop">Start shopping</a>
    </div>
  </section>

  <section class="sv-stack" aria-labelledby="failed">
    <h2 id="failed">After a failed load</h2>
    <div class="sv-message" data-tone="danger" role="alert">
      <span class="sv-message__mark" aria-hidden="true"></span>
      <p>We couldn't load your orders.</p>
      <a class="sv-button" data-variant="quiet" href="/orders">Try again</a>
    </div>
  </section>
</main>
</body>
</html>
