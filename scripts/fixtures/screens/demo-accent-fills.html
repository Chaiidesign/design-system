<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="expect" content="">
<title>Screen fixture: demo-accent-fills (a demo page shows every variant, so it may fill several parts with the accent)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.5 system-ui,sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{margin:0;font-size:28px;line-height:1.2}
p{margin:0}
:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}
/* A page-level accent token, as dist/tokens.css defines it. */
:root{--sv-color-accent:oklch(0.55 0.17 255)}
.row{display:flex;flex-wrap:wrap;gap:16px}
button{min-height:48px;padding:4px 16px;font:inherit;font-size:20px;font-weight:600;color:#fff;background:var(--sv-color-accent);border:2px solid var(--sv-color-accent);border-radius:12px}
</style>
</head>
<body>
<main>
<h1>Basket</h1>
<div class="row">
  <button type="button">Pay £60.75</button>
  <button type="button">Save for later</button>
</div>
</main>
</body>
</html>
