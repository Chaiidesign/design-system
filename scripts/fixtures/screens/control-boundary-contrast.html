<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="expect" content="control-boundary-contrast">
<title>Screen fixture: control-boundary-contrast</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.5 system-ui,sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{margin:0;font-size:28px;line-height:1.2}
p{margin:0}
button{min-height:48px;padding:0 16px;font:inherit;border:2px solid #555;border-radius:8px;background:#fff;color:#1a1a1a}
:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}
input{width:100%;min-height:48px;padding:0 8px;font:inherit;border:2px solid #c8c8c8;border-radius:8px;background:transparent;color:#1a1a1a}
</style>
</head>
<body>
<main>
<label for="e">Email address</label><input id="e" type="email">
</main>
</body>
</html>
