<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="expect" content="overflow-inside-part overflow-inside-part-200">
<title>Screen fixture: overflow-inside-part</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.5 system-ui,sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{margin:0;font-size:28px;line-height:1.2}
p{margin:0}
:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}
.panel{padding:16px;background:#f2f2f2;border-radius:12px}
/* An amount that cannot wrap, in a part narrower than the amount: it spills out of the part but stays inside the page. */
.sv-amount-box{inline-size:120px;white-space:nowrap;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>Order total</h1>
<section class="panel">
  <p class="sv-amount-box">£1,234,567.89 due</p>
</section>
</main>
</body>
</html>
