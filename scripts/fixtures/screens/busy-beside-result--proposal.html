<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="expect" content="busy-beside-result">
<title>Screen fixture: busy-beside-result--proposal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.5 system-ui,sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{margin:0;font-size:28px;line-height:1.2}
p,dl,dd{margin:0}
button{min-height:48px;padding:0 16px;font:inherit;border:2px solid #555;border-radius:8px;background:#fff;color:#1a1a1a}
:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}

</style>
</head>
<body>
<main>
<h1>Today</h1>
<article class="sv-chat-message"><p class="sv-chat-message__from">Souvenir</p>
  <div class="sv-chat-message__body">
    <p class="sv-status" data-tone="busy">Checking both calendars…</p>
    <section class="sv-proposal"><p>Move the event to Thursday</p></section>
  </div>
</article>
<!-- A busy status in a message of its own, and a success message elsewhere, is fine. -->
<article class="sv-chat-message"><p class="sv-chat-message__from">Souvenir</p>
  <div class="sv-chat-message__body"><p class="sv-status" data-tone="busy">Sending…</p></div>
</article>
<div class="sv-message" data-tone="success"><p>Saved.</p></div>
</main>
</body>
</html>
