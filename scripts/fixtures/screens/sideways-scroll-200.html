<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="expect" content="sideways-scroll-200">
<title>Screen fixture: sideways-scroll-200</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.5 system-ui,sans-serif}
main{padding:16px;display:grid;gap:16px}
h1{margin:0;font-size:28px;line-height:1.2}
p,dl,dd{margin:0}
button{min-height:48px;padding:0 16px;font:inherit;border:2px solid #555;border-radius:8px;background:#fff;color:#1a1a1a}
:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}
.block{inline-size:18rem}
</style>
</head>
<body>
<main>
<h1>Wide</h1>
<!-- 18rem: 288 pixels fits a 320 pixel screen with its 16 pixel gutters; at 200 percent text it is 576. -->
<p class="block">A block sized in rem.</p>
</main>
</body>
</html>
