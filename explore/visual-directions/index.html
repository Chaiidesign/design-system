<!-- Clay. Side-by-side view of the three visual directions. Work item 2.1. Disposable. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three visual directions (clay)</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  h2 { font-size: 1.125rem; margin: 16px 0 8px; }
  p { margin: 0 0 16px; max-width: 70ch; }
  nav a { margin-right: 16px; }
  .row { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 16px; }
  figure { margin: 0; flex: 0 0 375px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  iframe { width: 375px; height: 780px; border: 1px solid GrayText; display: block; }
</style>
<h1>Three visual directions for the same checkout screen</h1>
<p>Clay prototypes for work item 2.1. Same content and markup in each; only the appearance differs. Each frame is 375 pixels wide and scrolls.</p>
<nav>
  <a href="?theme=light">Light</a>
  <a href="?theme=dark">Dark</a>
  <a href="index.html">Follow this device</a>
</nav>
<div class="row" id="row"></div>
<h2>The same three on an assistant screen</h2>
<div class="row" id="row-assistant"></div>
<script>
  const theme = new URLSearchParams(location.search).get('theme');
  const q = theme ? '?theme=' + theme : '';
  const directions = [['ledger', 'Ledger'], ['instrument', 'Instrument'], ['signal', 'Signal']];
  function fill(rowId, page, suffix) {
    for (const [slug, name] of directions) {
      const f = document.createElement('figure');
      f.innerHTML = `<figcaption>${name} · <a href="${slug}/${page}${q}">open alone</a> · <a href="${slug}/rationale.md">rationale</a></figcaption><iframe title="${name}${suffix}" src="${slug}/${page}${q}"></iframe>`;
      document.getElementById(rowId).append(f);
    }
  }
  fill('row', 'index.html', '');
  fill('row-assistant', 'assistant.html', ': assistant');
</script>
</html>
