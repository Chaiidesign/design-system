<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native trial: checkout</title>
<!-- Clay. The same form as index.html in plain HTML, with no script. See README.md. -->
<link rel="stylesheet" href="trial.css">
<link rel="stylesheet" href="../../dist/souvenir.css">
</head>
<body>
<main class="sv-page sv-stack">
  <h1>Checkout</h1>
  <p>This is a test page. Nothing will be charged.</p>
  <form class="sv-stack" method="get" action="result.html">
    <div class="trial-field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-hint">
      <p class="trial-hint" id="email-hint">We'll send your receipt here</p>
    </div>

    <div class="trial-field">
      <label for="postcode">Postcode</label>
      <input id="postcode" name="postcode" type="text" autocomplete="postal-code" required>
    </div>

    <div class="trial-field">
      <label for="country">Country</label>
      <select id="country" name="country" autocomplete="country" required>
        <option value="">Choose your country</option>
        <option value="GB">United Kingdom</option>
        <option value="IE">Ireland</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
      </select>
    </div>

    <label class="trial-check">
      <input type="checkbox" name="terms" value="yes" required>
      I accept the terms of sale
    </label>

    <button type="submit">Pay £60.75</button>
  </form>
</main>
</body>
</html>
